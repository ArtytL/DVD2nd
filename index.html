<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>โละ DVD มือสอง</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; padding: 24px; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { padding: 8px 10px; min-width: 260px; }
    button { padding: 8px 12px; cursor: pointer; }
    #msg { margin-top: 10px; font-size: 14px; }
    .ok { color:#0a7f2e } .err{ color:#c62828 }
  </style>
</head>
<body>
  <h1>สั่งซื้อสินค้า</h1>
  <form id="order-form">
    <input id="email" type="email" placeholder="อีเมลของคุณ" required />
    <button id="submitBtn" type="submit">ยืนยันสั่งซื้อ</button>
  </form>
  <div id="msg"></div>

  <script>
    // ✅ ใช้โดเมน Vercel ของคุณ (แนะนำ path แบบไม่ใส่ .js)
    const ENDPOINT = "https://dvd-2nd.vercel.app/api/order-email.js";

    const form = document.getElementById("order-form");
    const email = document.getElementById("email");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const value = (email.value || "").trim();
      if (!value) return alert("กรอกอีเมลก่อนน้า");

      const old = btn.textContent; btn.textContent = "กำลังส่ง…"; btn.disabled = true; msg.textContent = "";
      try {
        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: value }),
        });
        const ct = res.headers.get("content-type") || "";
        const data = ct.includes("application/json") ? await res.json() : null;
        if (!res.ok) throw new Error((data && data.error) || `HTTP ${res.status}`);

        msg.textContent = "ส่งอีเมลยืนยันแล้ว!"; msg.className = "ok";
        email.value = "";
      } catch (err) {
        msg.textContent = "เกิดข้อผิดพลาด: " + err.message; msg.className = "err";
      } finally {
        btn.textContent = old; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
